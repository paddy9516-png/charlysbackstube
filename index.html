<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlys Backstube – Frische Backwaren & Dips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .topping { transition: all 0.25s ease-out; }
    .topping-enter { opacity: 0; transform: scale(0.4); }
    .topping-visible { opacity: 1; transform: scale(1); }
    .spicy-pulse { animation: spicyPulse 1.4s infinite alternate; }
    @keyframes spicyPulse {
      0% { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4)); }
      100% { filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.9)); }
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-stone-950 font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-stone-900 border-b border-stone-800 shadow px-4 h-12 flex items-center justify-between max-w-5xl mx-auto w-full">
    <button type="button" onclick="switchView('menu')" class="flex items-center gap-2 cursor-pointer bg-transparent border-0 p-0 text-left">
      <div class="w-6 h-6 rounded-md bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-[11px] shadow-sm">
        🥖
      </div>
      <span class="text-sm font-extrabold text-amber-400 tracking-tight">Charlys Backstube</span>
    </button>

    <!-- Navigation -->
    <nav class="flex items-center gap-1 text-xs">
      <button type="button" onclick="switchView('menu')" class="px-2 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Menü</button>
      <button type="button" onclick="switchView('pizza')" class="px-2.5 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Pizza</button>
      <button type="button" onclick="switchView('breads')" class="px-2.5 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Brote</button>
      <button type="button" onclick="switchView('dips')" class="px-2.5 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Dips</button>
      <button type="button" onclick="switchView('coming')" class="px-2 py-1 rounded-md text-amber-400 hover:text-amber-300 hover:bg-stone-800 transition font-bold">Bald da</button>
    </nav>

    <!-- Warenkorb Button -->
    <button type="button" onclick="switchView('cart')" class="relative flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-stone-950 px-3 py-1 rounded-lg font-bold text-xs shadow transition active:scale-95">
      <span>🛒</span>
      <span class="hidden sm:inline">Korb</span>
      <span id="header-cart-badge" class="bg-stone-950 text-amber-400 font-extrabold text-[10px] w-4 h-4 rounded-full flex items-center justify-center border border-amber-400/40">0</span>
    </button>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 pb-24">

    <!-- VIEW 1: MENÜ -->
    <section id="view-menu" class="space-y-6">
      <div class="text-center py-2">
        <h2 class="text-2xl sm:text-3xl font-black text-stone-100 tracking-tight">Frische Spezialitäten vorbestellen</h2>
        <p class="text-stone-200 font-medium text-sm mt-1 max-w-md mx-auto">Tippe auf eine Kategorie, wähle deine Artikel und sende die Bestellung direkt an den Ofen.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Pizza -->
        <button type="button" onclick="switchView('pizza')" class="text-left bg-stone-900 hover:bg-stone-850 border border-stone-800 hover:border-amber-500/60 p-5 rounded-2xl transition shadow-lg flex flex-col justify-between">
          <div>
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-2xl mb-3">🍕</div>
            <h3 class="text-lg font-bold text-stone-100">Pizza Konfigurator</h3>
            <p class="text-stone-200 text-xs mt-2 leading-relaxed font-medium">Standardgröße (32 cm). Belege deinen Steinofenteig frei mit 16 frischen Zutaten.</p>
          </div>
          <div class="mt-4 flex items-center text-amber-400 text-xs font-bold gap-1">
            <span>Konfigurieren →</span>
          </div>
        </button>

        <!-- Brote -->
        <button type="button" onclick="switchView('breads')" class="text-left bg-stone-900 hover:bg-stone-850 border border-stone-800 hover:border-amber-500/60 p-5 rounded-2xl transition shadow-lg flex flex-col justify-between">
          <div>
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-2xl mb-3">🥖</div>
            <h3 class="text-lg font-bold text-stone-100">Baguettes & Brote</h3>
            <p class="text-stone-200 text-xs mt-2 leading-relaxed font-medium">Klassiker, Laugenbrote, Zupfbrot und gefüllte Ciabatta-Variationen.</p>
          </div>
          <div class="mt-4 flex items-center text-amber-400 text-xs font-bold gap-1">
            <span>Auswählen →</span>
          </div>
        </button>

        <!-- Dips -->
        <button type="button" onclick="switchView('dips')" class="text-left bg-stone-900 hover:bg-stone-850 border border-stone-800 hover:border-amber-500/60 p-5 rounded-2xl transition shadow-lg flex flex-col justify-between">
          <div>
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-2xl mb-3">🥣</div>
            <h3 class="text-lg font-bold text-stone-100">Frische Dips & Cremes</h3>
            <p class="text-stone-200 text-xs mt-2 leading-relaxed font-medium">Hausgemachte Aufstriche: Tomatenbutter, Fetacremes, Aioli & Kräuterdips.</p>
          </div>
          <div class="mt-4 flex items-center text-amber-400 text-xs font-bold gap-1">
            <span>Auswählen →</span>
          </div>
        </button>

        <!-- Bald verfügbar -->
        <button type="button" onclick="switchView('coming')" class="text-left bg-stone-900 hover:bg-stone-850 border border-stone-800 hover:border-amber-500/60 p-5 rounded-2xl transition shadow-lg flex flex-col justify-between relative overflow-hidden">
          <div class="absolute top-3 right-3 bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-500/40">Vorschau</div>
          <div>
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-2xl mb-3">✨</div>
            <h3 class="text-lg font-bold text-stone-100">Bald verfügbar</h3>
            <p class="text-stone-200 text-xs mt-2 leading-relaxed font-medium">Einblick in kommende Teig-Innovationen und neue Kreationen aus der Backstube.</p>
          </div>
          <div class="mt-4 flex items-center text-amber-400 text-xs font-bold gap-1">
            <span>Ansehen →</span>
          </div>
        </button>
      </div>
    </section>

    <!-- VIEW 2: PIZZA -->
    <section id="view-pizza" class="hidden space-y-6">
      <div class="flex items-center justify-between border-b border-stone-800 pb-3">
        <div>
          <button type="button" onclick="switchView('menu')" class="text-xs text-amber-400 hover:underline flex items-center gap-1 mb-1 font-semibold">← Zurück zum Menü</button>
          <h2 class="text-xl sm:text-2xl font-black text-stone-100">Pizza Konfigurator (32 cm)</h2>
        </div>
        <button type="button" onclick="resetToppings()" class="text-xs text-stone-300 hover:text-amber-400 font-medium">Alle abwählen</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div class="lg:col-span-5 bg-stone-900 border border-stone-800 p-5 rounded-2xl flex flex-col items-center shadow
