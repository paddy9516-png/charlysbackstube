<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlys Backstube – Frische Backwaren & Dips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .topping { transition: all 0.25s ease-out; }
    .topping-enter { opacity: 0; transform: scale(0.4); }
    .topping-visible { opacity: 1; transform: scale(1); }
    .spicy-pulse { animation: spicyPulse 1.4s infinite alternate; }
    @keyframes spicyPulse {
      0% { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4)); }
      100% { filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.9)); }
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-stone-950 font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-stone-900 border-b border-stone-800 shadow px-4 h-12 flex items-center justify-between max-w-5xl mx-auto w-full">
    <button type="button" onclick="switchView('menu')" class="flex items-center gap-2 cursor-pointer bg-transparent border-0 p-0 text-left">
      <div class="w-6 h-6 rounded-md bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-[11px] shadow-sm">
        🥖
      </div>
      <span class="text-sm font-extrabold text-amber-400 tracking-tight">Charlys Backstube</span>
    </button>

    <!-- Navigation -->
    <nav class="flex items-center gap-1 text-xs">
      <button type="button" onclick="switchView('menu')" class="px-2 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Menü</button>
      <button type="button" onclick="switchView('pizza')" class="px-2.5 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Pizza</button>
      <button type="button" onclick="switchView('breads')" class="px-2.5 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Brote</button>
      <button type="button" onclick="switchView('dips')" class="px-2.5 py-1 rounded-md text-stone-300 hover:text-white hover:bg-stone-800 transition">Dips</button>
      <button type="button" onclick="switchView('coming')" class="px-2 py-1 rounded-md text-amber-400 hover:text-amber-300 hover:bg-stone-800 transition font-bold">Bald da</button>
    </nav>
